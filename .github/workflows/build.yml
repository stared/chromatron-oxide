name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Intel + Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Apple Silicon bundle and DMG
        run: |
          bash .github/scripts/build_macos_bundle.sh dist/apple-silicon/Chromatron.app target/aarch64-apple-darwin/release/chromatron
          bash .github/scripts/create_unsigned_dmg.sh dist/apple-silicon/Chromatron.app dist/Chromatron-macos-apple-silicon-unsigned.dmg

      - name: Create Intel bundle and DMG
        run: |
          bash .github/scripts/build_macos_bundle.sh dist/intel/Chromatron.app target/x86_64-apple-darwin/release/chromatron
          bash .github/scripts/create_unsigned_dmg.sh dist/intel/Chromatron.app dist/Chromatron-macos-intel-unsigned.dmg

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-macos-apple-silicon-dmg
          path: dist/Chromatron-macos-apple-silicon-unsigned.dmg
          if-no-files-found: error

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-macos-intel-dmg
          path: dist/Chromatron-macos-intel-unsigned.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/chromatron.exe dist/
          cd dist && 7z a ../Chromatron-windows-x86_64.zip chromatron.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-windows-x86_64-zip
          path: Chromatron-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/chromatron dist/
          tar czf Chromatron-linux-x86_64.tar.gz -C dist chromatron

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-linux-x86_64-tar
          path: Chromatron-linux-x86_64.tar.gz
          if-no-files-found: error

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          TRUNK_VERSION="0.21.5"
          wget -qO- "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xzf -
          chmod +x trunk
          sudo mv trunk /usr/local/bin/

      - name: Build WASM with Trunk
        run: trunk build --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-wasm
          path: web/dist/
          if-no-files-found: error

  publish-site:
    name: Publish landing page and artifacts
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux, build-wasm]
    if: github.ref == 'refs/heads/main'
    env:
      DIST_REPO: ${{ vars.DIST_REPO != '' && vars.DIST_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.DIST_REPO_PAT != '' && secrets.DIST_REPO_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Apple Silicon DMG
        uses: actions/download-artifact@v4
        with:
          name: chromatron-macos-apple-silicon-dmg
          path: artifacts/dmg

      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: chromatron-macos-intel-dmg
          path: artifacts/dmg

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: chromatron-windows-x86_64-zip
          path: artifacts/windows

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: chromatron-linux-x86_64-tar
          path: artifacts/linux

      - name: Download WASM build
        uses: actions/download-artifact@v4
        with:
          name: chromatron-wasm
          path: artifacts/wasm

      - name: Publish artifacts to latest release
        run: |
          gh release view latest --repo "$DIST_REPO" >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest build" \
              --notes "Automated build artifacts published from source repository." \
              --repo "$DIST_REPO"
          gh release upload latest \
            artifacts/dmg/Chromatron-macos-apple-silicon-unsigned.dmg \
            artifacts/dmg/Chromatron-macos-intel-unsigned.dmg \
            artifacts/windows/Chromatron-windows-x86_64.zip \
            artifacts/linux/Chromatron-linux-x86_64.tar.gz \
            --clobber \
            --repo "$DIST_REPO"

      - name: Prepare static site content
        run: |
          mkdir -p site
          cp -r artifacts/wasm site/play
          cp .github/templates/chromatron_level_3.png site/
          REPO_OWNER=$(echo $DIST_REPO | cut -d/ -f1)
          REPO_NAME=$(echo $DIST_REPO | cut -d/ -f2)
          SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          BUILD_UTC="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          COMMIT_SHORT="${GITHUB_SHA:0:12}"
          DMG_ARM64_SHA256="$(sha256sum artifacts/dmg/Chromatron-macos-apple-silicon-unsigned.dmg | awk '{print $1}')"
          DMG_X86_64_SHA256="$(sha256sum artifacts/dmg/Chromatron-macos-intel-unsigned.dmg | awk '{print $1}')"
          WIN_ZIP_SHA256="$(sha256sum artifacts/windows/Chromatron-windows-x86_64.zip | awk '{print $1}')"
          LINUX_TAR_SHA256="$(sha256sum artifacts/linux/Chromatron-linux-x86_64.tar.gz | awk '{print $1}')"
          DMG_ARM64_SIZE="$(ls -lh artifacts/dmg/Chromatron-macos-apple-silicon-unsigned.dmg | awk '{print $5}')B"
          DMG_X86_64_SIZE="$(ls -lh artifacts/dmg/Chromatron-macos-intel-unsigned.dmg | awk '{print $5}')B"
          WIN_ZIP_SIZE="$(ls -lh artifacts/windows/Chromatron-windows-x86_64.zip | awk '{print $5}')B"
          LINUX_TAR_SIZE="$(ls -lh artifacts/linux/Chromatron-linux-x86_64.tar.gz | awk '{print $5}')B"
          sed \
            -e "s|__DIST_REPO__|${DIST_REPO}|g" \
            -e "s|__SITE_URL__|${SITE_URL}|g" \
            -e "s|__BUILD_UTC__|${BUILD_UTC}|g" \
            -e "s|__COMMIT_SHORT__|${COMMIT_SHORT}|g" \
            -e "s|__DMG_ARM64_SHA256__|${DMG_ARM64_SHA256}|g" \
            -e "s|__DMG_X86_64_SHA256__|${DMG_X86_64_SHA256}|g" \
            -e "s|__WIN_ZIP_SHA256__|${WIN_ZIP_SHA256}|g" \
            -e "s|__LINUX_TAR_SHA256__|${LINUX_TAR_SHA256}|g" \
            -e "s|__DMG_ARM64_SIZE__|${DMG_ARM64_SIZE}|g" \
            -e "s|__DMG_X86_64_SIZE__|${DMG_X86_64_SIZE}|g" \
            -e "s|__WIN_ZIP_SIZE__|${WIN_ZIP_SIZE}|g" \
            -e "s|__LINUX_TAR_SIZE__|${LINUX_TAR_SIZE}|g" \
            .github/templates/public-index.html.tmpl > site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [publish-site]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
