name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: intel
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    name: macOS (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --features sdl2/static-link

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/chromatron
