[package]
name = "chromatron"
version = "0.1.0"
edition = "2024"
description = "Pixel-perfect recompilation of Chromatron (laser puzzle game)"

[dependencies]
winit = "0.30"
softbuffer = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSEnumerator"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction", "objc2-core-foundation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Storage"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

[dev-dependencies]
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
